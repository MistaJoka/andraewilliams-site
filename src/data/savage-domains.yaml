# The ten domains of The Savage Bible. Data, not an enum: a new domain is
# a row here plus a folder under src/content/savage/<id>/. `code` is the
# prefix in citation ids (BDY·03) and must be unique.
- id: body
  label: Body
  code: BDY
  creed: The body is the first instrument. It is kept sharp, strong, and ready every day of a long life.
  blurb: Strength, conditioning, mobility, sleep, nutrition, and the discipline that makes them automatic.
  order: 1
- id: mind
  label: Mind
  code: MND
  creed: The mind is trained like the body — fed deliberately, tested daily, and never allowed to go soft.
  blurb: Learning, reasoning, focus, memory, and the habits that keep judgement clear under load.
  order: 2
- id: character
  label: Character
  code: CHR
  creed: Word is bond. Conduct does not change with the audience, the stakes, or the odds of being caught.
  blurb: Integrity, discipline, courage, restraint, and the private standards nobody checks.
  order: 3
- id: craft
  label: Craft
  code: CRF
  creed: Mastery of the work, owned end to end, shipped and defended in public.
  blurb: Professional skill, depth, output, tooling, and the reputation that compounds from them.
  order: 4
- id: money
  label: Money
  code: MNY
  creed: Money is a tool under command — earned in multiples, kept on purpose, never a source of fear.
  blurb: Income, savings, investing, debt, risk, and the numbers known cold.
  order: 5
- id: relationships
  label: Relationships
  code: REL
  creed: Chosen people are held to a high standard and served to a higher one.
  blurb: Partner, family, friends, mentors, and the obligations that come with being trusted.
  order: 6
- id: speech
  label: Speech & Presence
  code: SPK
  creed: Every word is deliberate. The room changes when you enter it, and calms when you speak.
  blurb: Communication, writing, bearing, dress, listening, and command of a room.
  order: 7
- id: home
  label: Home & Order
  code: HME
  creed: The environment is an extension of the mind — ordered, maintained, and ready for anything.
  blurb: Living space, systems, routines, maintenance, and logistics that never need thinking about.
  order: 8
- id: survival
  label: Survival & Capability
  code: SRV
  creed: When things break, you are the one who knows what to do — and does it.
  blurb: First aid, fixing things, navigation, preparedness, and the physical competence to protect.
  order: 9
- id: legacy
  label: Legacy & Leadership
  code: LGC
  creed: Build things that outlive you, and people who outgrow you.
  blurb: Leading, teaching, building institutions, and the long game measured in decades.
  order: 10
