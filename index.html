<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>andraewilliams.com</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #070b12; color: #e8edf2; font-family: system-ui, sans-serif; }
    .hidden { display: none !important; }
    #ascii-canvas { display: block; width: 100%; height: 100vh; }
    #fallback-content {
      height: 100%; display: flex;
      align-items: center; justify-content: center;
      text-align: center; padding: 1rem;
    }
    #fallback-content p { color: #7a8a9a; font-size: 0.95rem; }

    @keyframes glitch-cut {
      0% { clip-path: inset(0 0 0 0); transform: translate(0, 0); filter: hue-rotate(0deg); }
      10% { clip-path: inset(10% 0 60% 0); transform: translate(-2%, 0); filter: hue-rotate(15deg); }
      20% { clip-path: inset(60% 0 5% 0); transform: translate(2%, 0); filter: hue-rotate(-20deg); }
      30% { clip-path: inset(30% 0 40% 0); transform: translate(-1%, 0); filter: hue-rotate(0deg); }
      40% { clip-path: inset(5% 0 70% 0); transform: translate(1%, 0); }
      100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); filter: hue-rotate(0deg); }
    }
    #ascii-canvas.glitching { animation: glitch-cut 220ms steps(2, end); }
  </style>
</head>
<body>
  <canvas id="ascii-canvas" class="hidden"></canvas>
  <main id="fallback-content">
    <div>
      <h1>andraewilliams.com</h1>
      <p>Rebuilding from a clean slate. Something new is coming.</p>
    </div>
  </main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
