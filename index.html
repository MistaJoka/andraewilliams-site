<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>andraewilliams.com — AI-built projects, rendered in ASCII</title>
  <meta name="description" content="A gallery of small projects written by AI and rendered live in the browser as WebGL ASCII art.">
  <meta name="theme-color" content="#070b12">
  <link rel="canonical" href="https://www.andraewilliams.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.andraewilliams.com/">
  <meta property="og:title" content="andraewilliams.com — AI-built projects, rendered in ASCII">
  <meta property="og:description" content="A gallery of small projects written by AI and rendered live in the browser as WebGL ASCII art.">
  <!-- summary, not summary_large_image: there is no og:image yet. Add a
       captured still of the hero and upgrade this line then. -->
  <meta name="twitter:card" content="summary">
  <style>
    :root {
      --navy: #070b12;
      --blue: #0a3d62;
      --teal: #1fd1c1;
      --green: #4fd35a;
      --amber: #ff9d2f;
      --red: #ff3b3b;
      --line: #1c2733;
      --text-0: #e8edf2;
      --text-1: #7a8a9a;
    }

    html, body { height: 100%; margin: 0; }
    body {
      background: var(--navy); color: var(--text-0);
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    }
    .hidden { display: none !important; }

    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
    }
    .site-header .wordmark {
      font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal);
    }

    .section-title {
      text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; color: var(--text-1);
      padding: 1.5rem 1.5rem 0.75rem; margin: 0;
    }

    #hero-section { position: relative; height: 70vh; }
    #ascii-canvas { display: block; width: 100%; height: 100%; }
    #fallback-content {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      text-align: center; padding: 1rem;
    }
    #fallback-content p { color: var(--text-1); font-size: 0.95rem; }

    #gallery-stage {
      position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 65vh;
    }
    #gallery-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    #gallery-grid-overlay {
      position: absolute; inset: 0;
      display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr;
    }
    .gallery-tile {
      background: transparent; border: 1px solid var(--line); color: var(--text-1);
      font-family: inherit; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.7rem;
      display: flex; align-items: flex-end; justify-content: flex-start;
      padding: 0.5rem; cursor: pointer; transition: border-color 150ms ease-out, color 150ms ease-out;
    }
    .gallery-tile:hover, .gallery-tile:focus-visible {
      border-color: var(--teal); color: var(--teal); outline: none;
    }
    .tile-title { pointer-events: none; }

    #project-embed {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: var(--navy);
    }

    #project-detail {
      border: 1px solid var(--line); border-top: none;
      padding: 1.25rem 1.5rem 1.5rem;
    }
    #project-detail:focus { outline: none; }
    #project-detail:focus-visible { outline: 1px solid var(--teal); outline-offset: -1px; }
    .detail-title {
      margin: 0 0 0.5rem; font-size: 1rem; color: var(--teal);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .detail-blurb { margin: 0 0 1rem; color: var(--text-0); font-size: 0.85rem; line-height: 1.6; max-width: 62ch; }
    .detail-meta {
      display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1.25rem;
      margin: 0 0 1rem; font-size: 0.75rem;
    }
    .detail-meta dt { color: var(--text-1); text-transform: uppercase; letter-spacing: 0.08em; }
    .detail-meta dd { margin: 0; color: var(--text-0); }
    .detail-source { color: var(--amber); font-size: 0.75rem; text-decoration: none; letter-spacing: 0.06em; }
    .detail-source:hover, .detail-source:focus-visible { text-decoration: underline; }

    /* Off-screen but still announced by screen readers — how mode
       changes are narrated without showing a status line to everyone. */
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    #gallery-back {
      position: absolute; top: 0.75rem; left: 0.75rem; z-index: 2;
      background: var(--navy); border: 1px solid var(--line); color: var(--text-0);
      font-family: inherit; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem;
      padding: 0.4rem 0.75rem; cursor: pointer;
    }
    #gallery-back:hover { border-color: var(--teal); color: var(--teal); }

    .site-footer {
      padding: 1rem 1.5rem; border-top: 1px solid var(--line);
      color: var(--text-1); font-size: 0.75rem; text-align: center;
    }

    /* ELI5: a "glitch" = briefly showing the wrong slice in the wrong
       place. clip-path cuts a thin band, transform nudges it sideways,
       hue-rotate shifts its color. */
    @keyframes glitch-cut {
      0% { clip-path: inset(0 0 0 0); transform: translate(0, 0); filter: hue-rotate(0deg); }       /* rest state */
      10% { clip-path: inset(10% 0 60% 0); transform: translate(-2%, 0); filter: hue-rotate(15deg); } /* band torn near top, shifted left */
      20% { clip-path: inset(60% 0 5% 0); transform: translate(2%, 0); filter: hue-rotate(-20deg); }  /* band torn near bottom, shifted right */
      30% { clip-path: inset(30% 0 40% 0); transform: translate(-1%, 0); filter: hue-rotate(0deg); }  /* mid band, smaller shift */
      40% { clip-path: inset(5% 0 70% 0); transform: translate(1%, 0); }                              /* another top-heavy band */
      100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); filter: hue-rotate(0deg); }       /* settle back to rest */
    }
    /* steps(2, end): jump between keyframes instantly instead of
       interpolating — that's what sells a "cut" instead of a fade. */
    #ascii-canvas.glitching { animation: glitch-cut 220ms steps(2, end); }
    .gallery-tile:hover { animation: glitch-cut 220ms steps(2, end); }

    @media (max-width: 640px) {
      #gallery-grid-overlay { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="wordmark">andraewilliams.com</span>
  </header>

  <!-- ELI5: the canvas starts hidden and a plain-text fallback shows
       instead. js/main.js only removes the "hidden" class once WebGL has
       actually initialized successfully — so on a browser/device without
       WebGL support, visitors see readable text instead of a blank canvas
       or a JS error. -->
  <section id="hero-section">
    <canvas id="ascii-canvas" class="hidden"></canvas>
    <main id="fallback-content">
      <div>
        <h1>andraewilliams.com</h1>
        <p>Rebuilding from a clean slate. Something new is coming.</p>
      </div>
    </main>
  </section>

  <section id="gallery-section">
    <h2 class="section-title">Gallery</h2>
    <div id="gallery-stage">
      <canvas id="gallery-canvas"></canvas>
      <!-- Tiles are built from js/projects.js — the single source of
           truth for what exists. Nothing project-specific is written
           into this file. -->
      <div id="gallery-grid-overlay"></div>
      <iframe id="project-embed" class="hidden" title="Embedded project"></iframe>
      <button id="gallery-back" class="hidden" type="button">&larr; Back to grid</button>
    </div>
    <article id="project-detail" class="hidden" tabindex="-1"></article>
    <p id="gallery-status" class="visually-hidden" role="status" aria-live="polite"></p>
  </section>

  <footer class="site-footer">
    <span>&copy; 2026 Andrae Williams</span>
  </footer>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
